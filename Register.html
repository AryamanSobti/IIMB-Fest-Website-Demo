<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register for IIMB Fest</title>
  </head>
  <body>
    <header>
        <img src="https://www.iimb.ac.in/sites/default/files/inline-images/IIMB-Logo.png" alt="IIMB Logo" height="70px">
        <h1>IIMB Fest - 2026</h1>
        <p>Welcome to the best fest on Balgalore. We hope you have a great time.</p>

        <nav>
            <a href="./index.html">Click Here To Go Back To Home Page</a>
        </nav>

    </header>
    <main>
        <section>
             <hr>
            <h2>Register for the fest</h2>
            <form action="/register">
                <label for="name">Enter Your Name</label>
                <input type="text" name="name" id="name" required minlength="2" maxlength="20">
                <br><br>
                <label for="email">Enter Your E-Mail</label>
                <input type="email" name="email" id="email">
                <br><br>
                <label for="T-Shirt_Size">Select T-Shirt Size</label>
                <select name="T-Shirt_Size" id="T-Shirt_Size">
                    <option value="0">--please select size--</option>
                    <option value="38">38</option>
                    <option value="40">40</option>
                    <option value="42">42</option>
                    <option value="44">44</option>
                </select>
                <br><br>
                <label for="checkbox1">Do you agree to all the fest terms & conditions?</label>
                <input type="checkbox" name="" id="checkbox1" required>
                <br><br>
                <label for="alumini">Alumini</label>
                <input type="radio" name="attendee_type" id="alumini" value="alumini">
                <label for="student">Student</label>
                <input type="radio" name="attendee_type" id="student" value="student">
                <br><br>
                <button type="submit">Register</button>
            </form>

        </section>

    </main>
  </body>
</html>
